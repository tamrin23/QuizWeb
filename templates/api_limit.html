<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>API Limit</title>
</head>

<body>
    <div class="api-container">
        <h1>AI Quiz Temporarily Unavailable</h1>

        <p class="api-message">
            The Gemini API daily limit has been reached.
        </p>

        <p>
            You can continue practicing using our local question bank.
        </p>

        <form action="/start-local-quiz" method="POST">

            <input type="hidden" name="topic" value="{{ topic }}">
            <input type="hidden" name="number" value="{{ number }}">
            <input type="hidden" name="difficulty" value="{{ difficulty }}">

            <button type="submit" class="local-btn">
                Use Local Questions
            </button>

        </form>

        <br>

        <a href="/" class="back-link">Back to Home</a>
    </div>
</body>
</html>
